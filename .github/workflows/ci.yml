name: ZeroRaft

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run --timeout=3m

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Run tests with race detector and coverage (internal only)
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Filter coverage (exclude generated protobuf)
        run: |
          cat coverage.out | grep -v "internal/api/raft.pb.go" > coverage.filtered.out
          go tool cover -func=coverage.filtered.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{if ($1 < 70) exit 1}'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Build
        run: go build -o /dev/null ./cmd/zeroraft

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Start cluster
        run: docker compose up -d
      - name: Wait for cluster to be ready
        run: |
          # Wait for nodes to start and elect a leader
          for i in $(seq 1 30); do
            # Use client containers to check leader status
            LEADER=$(docker run --rm --network zeroraft_zeroraft-net \
              zeroraft:latest --cli --addr=node1:9000 2>/dev/null <<< $'/leader\n/exit' | grep "Leader:" || echo "")
            if [ -n "$LEADER" ]; then
              echo "Leader elected: $LEADER"
              break
            fi
            echo "Attempt $i: waiting for leader election..."
            sleep 1
          done
      - name: Send /set command and verify replication with retry loop
        run: |
          echo "Sending /set smoke hello to node1..."
          docker run --rm --network zeroraft_zeroraft-net \
            zeroraft:latest --cli --addr=node1:9000 <<< $'/set smoke hello\n/exit'

          # Wait for replication on node2 (retry up to 10 times)
          echo "Waiting for replication to node2..."
          for i in $(seq 1 10); do
            RESULT=$(docker run --rm --network zeroraft_zeroraft-net \
              zeroraft:latest --cli --addr=node2:9000 <<< $'/get smoke\n/exit')
            if echo "$RESULT" | grep -q "hello"; then
              echo "node2: OK (attempt $i)"
              break
            fi
            echo "Retry $i/10: value not yet replicated to node2"
            sleep 1
          done

          # Wait for replication on node3 (retry up to 10 times)
          echo "Waiting for replication to node3..."
          for i in $(seq 1 10); do
            RESULT=$(docker run --rm --network zeroraft_zeroraft-net \
              zeroraft:latest --cli --addr=node3:9000 <<< $'/get smoke\n/exit')
            if echo "$RESULT" | grep -q "hello"; then
              echo "node3: OK (attempt $i)"
              break
            fi
            echo "Retry $i/10: value not yet replicated to node3"
            sleep 1
          done

          # Final check – fail if value is missing on either node
          echo "Performing final verification..."
          FINAL_NODE2=$(docker run --rm --network zeroraft_zeroraft-net \
            zeroraft:latest --cli --addr=node2:9000 <<< $'/get smoke\n/exit')
          if ! echo "$FINAL_NODE2" | grep -q "hello"; then
            echo "FAIL: value not replicated to node2 after 10 attempts"
            exit 1
          fi
          FINAL_NODE3=$(docker run --rm --network zeroraft_zeroraft-net \
            zeroraft:latest --cli --addr=node3:9000 <<< $'/get smoke\n/exit')
          if ! echo "$FINAL_NODE3" | grep -q "hello"; then
            echo "FAIL: value not replicated to node3 after 10 attempts"
            exit 1
          fi
          echo "All nodes have the value. Smoke test passed."
      - name: Shutdown
        if: always()
        run: docker compose down

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install addlicense
        run: go install github.com/google/addlicense@latest
      - name: Check headers
        run: |
          $HOME/go/bin/addlicense -check -ignore "docs/**" -ignore "examples/**" .
