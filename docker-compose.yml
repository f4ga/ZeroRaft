services:
  node1:
    build: .
    image: zeroraft:latest
    command: [ "--id", "1", "--addr", "0.0.0.0:9000", "--peers", "2=node2:9000,3=node3:9000" ]
    healthcheck:
      test: ["CMD", "/usr/local/bin/zeroraft", "--health"]
      interval: 5s
      timeout: 2s
      start_period: 15s
      retries: 3
    networks:
      - zeroraft-net
    restart: unless-stopped

  node2:
    build: .
    image: zeroraft:latest
    command: [ "--id", "2", "--addr", "0.0.0.0:9000", "--peers", "1=node1:9000,3=node3:9000" ]
    healthcheck:
      test: ["CMD", "/usr/local/bin/zeroraft", "--health"]
      interval: 5s
      timeout: 2s
      start_period: 15s
      retries: 3
    networks:
      - zeroraft-net
    restart: unless-stopped

  node3:
    build: .
    image: zeroraft:latest
    command: [ "--id", "3", "--addr", "0.0.0.0:9000", "--peers", "1=node1:9000,2=node2:9000" ]
    healthcheck:
      test: ["CMD", "/usr/local/bin/zeroraft", "--health"]
      interval: 5s
      timeout: 2s
      start_period: 15s
      retries: 3
    networks:
      - zeroraft-net
    restart: unless-stopped

networks:
  zeroraft-net:
    driver: bridge
